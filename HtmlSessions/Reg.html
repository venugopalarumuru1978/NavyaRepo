<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>
        body{
            background-color: cadetblue;
            margin: 10px;
        }
        
        h1,h2,h3,h4,h5,h6{
            text-align: center;
            color:whitesmoke;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        label {
            font-weight: bold;
            font-size:medium;
        }

        .flex-container {
            display: flex;       /* Activates flexbox alignment */
            gap: 10px;          /* Adds spacing between your side-by-side containers */
        }

        .box {
        flex: 1;            /* Forces them to grow and share the width equally */
        padding: 20px;
        background-color: #f0f0f0;
        border-radius: 10px;
        }

        .textbox {
            width:100%;
            height: 30px;
            font-weight: bold;
            color:green;
            border-radius: 10px;
        }

        .course_box {
            width: 100%;
            height: 50px;
            font-weight: bold;
            border-radius: 5px;
        }

        .btnReg{
            width:150px;
            height: 40px;
            background-color: green;
            color:greenyellow;
            font-weight: bold;
        }

        .btnReset{
            width:150px;
            height: 40px;
            background-color: red;
            color:greenyellow;
            font-weight: bold;
        }


    </style>
</head>
<body>
    <h1>Register Page</h1>
    <hr />
    <form name="frmReg">
    <div  class="flex-container">
        <div class="box">
            <label>Student Name</label><br />
            <input type="text"  name="txtSname" placeholder="Student Name" class="textbox" />
        </div>

        <div class="box">
            <label>Gender</label> <br />
            <input type="radio"  name="rdoGender"  value="Male" />
            <label>Male</label>

            <input type="radio"  name="rdoGender"  value="Female" />
            <label>Female</label>
        </div>
        <div class="box">
            <label>Location</label> <br />
            <select  name="ddlLoc" class="textbox">
                <option value="Hyderabad">Hyderabad</option>
                <option value="Bangalore">Bangalore</option>
                <option value="Amaravathi">Amaravathi</option>
            </select>
        </div>    
    </div>
<br />
<div class="flex-container">
    <div style="text-align: center; width: 100%;">
        <input type="button"  value="Register" class="btnReg" onclick="SaveStudent()" />
        &nbsp;&nbsp;&nbsp;
        <input type="button"  value="Reset" class="btnReset" />
    </div>
</div>
</form>
<table width="100%" border="1" id="stdinfo">
    <tr>
        <th>Student name</th>
        <th>Gender</th>
        <th>Location</th>
    </tr>
</table>

<script type="text/javascript">
    function SaveStudent()
    {
        let sname = frmReg.txtSname.value;
        let gender = frmReg.rdoGender.value;
        let loc = frmReg.ddlLoc.value;

        // 1. Find the table body target
        const tableRow = document.getElementById("stdinfo");

        // 2. Insert a new row at the end of the table body (-1)
        const newRow = tableRow.insertRow(-1);

        // 3. Insert cells (<td>) into the new row
        const cell1 = newRow.insertCell(0);
        const cell2 = newRow.insertCell(1);
        const cell3 = newRow.insertCell(2);

        // 4. Add data/text to the cells
        cell1.textContent = sname;
        cell2.textContent = gender;
        cell3.textContent = loc;
    }

</script>
</body>
</html>
