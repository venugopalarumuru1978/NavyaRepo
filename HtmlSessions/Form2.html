<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
</head>
<body>
    <h2 style="text-align: center;">Register Page</h2>
    <hr />
    <table width="100%">
        <tr>
            <td width="25%"></td>
            <td width="50%">
                    <p style="text-align: center;">
                        <label>Student Name</label><br />
                        <input type="text"  name="txtSname" />

                        <br /><br />
                        <label>Gender</label> <br />
                        <input type="radio"  name="rdoGender"  value="Male" />
                        <label>Male</label>

                        <input type="radio"  name="rdoGender"  value="Female" />
                        <label>Female</label>

                        <br /><br />
                        <label>Age of Student</label> <br />
                        <input type="number"  name="txtAge"  min="20"  max="30" />

                        <br /><br />
                        <label>Hobbies</label> <br />
                       
                        <input type="checkbox"  name="chkHb1"  value="reading" />
                        <label>Reading Books</label>
                        
                        <input type="checkbox"  name="chkHb2"  value="chess" />
                        <label>Playing Chess</label>
                        
                        <input type="checkbox"  name="chkHb3"  value="garden" />
                        <label>Gardening</label>

                        <br /><br />
                        <label>Courses</label> <br />

                        <select  name="ddlCourse" multiple>
                            <option value="HTML">HTML</option>
                            <option value="CSS">CSS</option>
                            <option value="JavaScript">JavaScript</option>
                        </select>

                        <br /><br />
                        <label>Location</label> <br />

                        <select  name="ddlLoc">
                            <option value="Hyderabad">Hyderabad</option>
                            <option value="Bangalore">Bangalore</option>
                            <option value="Amaravathi">Amaravathi</option>
                        </select>
                        <br /><br />
                        <label>Student Email</label><br />
                        <input type="email"  name="txtEmail" />

                        <br />    <br />
                        <input type="button"  value="Register here" />
                        <input type="button"  value="Clear Form" />
                        
                    </p>
            </td>
            <td width="25%"></td>
        </tr>

    </table>    
</body>
</html>
