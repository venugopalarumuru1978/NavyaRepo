<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>

        .box{
            width: 500px;
            height: 200px;
            background-color: cornflowerblue;
            padding: 20px;
            margin-left: 30%;            
            border-radius: 20px;
            border: solid;
            border-color: brown;     
        }

        label{
            font-size: large;
            color:bisque;            
        }

        .textbox{
            width: 100%;
            height: 30px;
            color:blue;
            border-radius: 10px;
            font-weight: bold;
        }

        .btnLogin{
            width:150px;
            height: 40px;
            background-color: green;
            color:greenyellow;
            font-weight: bold;
        }

        .btnReset{
            width:150px;
            height: 40px;
            background-color: red;
            color:greenyellow;
            font-weight: bold;
        }

</style>
</head>
<body style="background-color: cornflowerblue;" onload="delUser()">
    <h2 style="text-align: center;">Login Page</h2>
    <hr />
    <form name="frmLogin"  method="post" action="Welcome.html" onsubmit="return UserCheck()">
        <div class="box">
                <label>Username</label><br />
                <input type="text"  name="txtUname" class="textbox" required />

                        <br />
                <label>Password</label> <br />
                <input type="password"  name="txtPwd" class="textbox" required />
                        
                    <br /><br />
                <div style="text-align: center;width: 100%;">
                    <input type="submit"  value="Login here" class="btnLogin"  />
                    <input type="reset"  value="Clear Form" class="btnReset" />                                                             
                </div>
        </div>
    </form>
        <h2 style="text-align: center;color:red" id="info">        
        </h2>

        <script type="text/javascript">
            let userinfo = [
                {"user":"Venugopal", "pwd":"v@123"},
                {"user":"Priya", "pwd":"p@123"},
            ];

            function UserCheck()
            {

                let uname = frmLogin.txtUname.value;
                let pwd = frmLogin.txtPwd.value;
                let flag = false;
                userinfo.map((u)=>{
                    if(u.user===uname && u.pwd===pwd)
                    {
                        sessionStorage.setItem("user", uname);
                        flag = true;
                        return flag;
                    }
                });

                if(flag==false)
                {
                    document.getElementById("info").innerHTML = "Please check username / password";
                    return flag;
                }
            }
            function delUser()
            {
                if(sessionStorage.getItem("user")!=null)
                {
                    sessionStorage.removeItem("user");
                }
            }
        </script>
</body>
</html>
