<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>

        .box{
            width: 500px;
            height: 200px;
            background-color: cornflowerblue;
            padding: 20px;
            margin-left: 30%;            
            border-radius: 20px;
            border: solid;
            border-color: brown;     
        }

        label{
            font-size: large;
            color:bisque;            
        }

        .textbox{
            width: 100%;
            height: 30px;
            color:blue;
            border-radius: 10px;
            font-weight: bold;
        }

        .btnLogin{
            width:150px;
            height: 40px;
            background-color: green;
            color:greenyellow;
            font-weight: bold;
        }

        .btnReset{
            width:150px;
            height: 40px;
            background-color: red;
            color:greenyellow;
            font-weight: bold;
        }

</style>
</head>
<body style="background-color: cornflowerblue;">
    <h2 style="text-align: center;">Login Page</h2>
    <hr />

            <p class="box">
                        <label>Username</label><br />
                        <input type="text"  name="txtUname" class="textbox" />

                        <br />
                        <label>Password</label> <br />
                        <input type="password"  name="txtPwd" class="textbox" />
                        
                    <br /><br />
                        <input type="button"  value="Login here" class="btnLogin" />
                        <input type="button"  value="Clear Form" class="btnReset" />                                                             
                </p>
</body>
</html>
