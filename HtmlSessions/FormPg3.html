<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
</head>
<body>
    <h1 style="text-align: center;">Text Box Demo</h1>
    <form  name="frmTest">
        <p style="text-align: center;">
            <input type="text"  name="txtVal1" placeholder="Value - 1" />
            <br /><br />
            <input type="text"  name="txtVal2" placeholder="Value - 2" />
            <br /><br />
            <input type="button"  value="Addition" onclick="AddFun()" />
            &nbsp;&nbsp;&nbsp;&nbsp;
            <input type="button"  value="Reset" onclick="ResetForm()" />
        </p>
    </form>

    <h2 style="text-align: center;"  id="res"></h2>

    <script type="text/javascript">
        function AddFun()
        {
            let x = parseFloat(frmTest.txtVal1.value);
            let y = parseFloat(frmTest.txtVal2.value);
            let sum = x+y;
            document.getElementById("res").innerHTML = "Add : " + sum;
        }

        function ResetForm()
        {
            frmTest.txtVal1.value = "";
            frmTest.txtVal2.value = "";
            document.getElementById("res").innerHTML = "";
        }

    </script>
</body>
</html>
