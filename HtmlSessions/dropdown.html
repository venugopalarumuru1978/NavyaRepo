<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
</head>
<body>
    <h1 style="text-align: center;">Dropdown List Demo</h1>
    <form  name="frmTest">
        <p style="text-align: center;">
            <label>Location</label>
            <br />
            <select name="ddlLoc" onchange="DemoDropdown()">
                <option  value="-1">City</option>
                <option  value="Hyderabad">Hyderabad</option>
                <option  value="Amaravathi">Amaravathi</option>
            </select>
        </p>
    </form>

    <h2 style="text-align: center;"  id="res"></h2>

    <script type="text/javascript">
        function DemoDropdown()
        {
                let cname = frmTest.ddlLoc.value;
                if(cname!="-1")
                    document.getElementById("res").innerHTML = "Ur City is " + cname;
                else
                    {
                        alert("Please select city");
                        document.getElementById("res").innerHTML ="";
                    }
        }
    </script>
</body>
</html>
