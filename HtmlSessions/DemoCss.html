<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>
        body{
            background-image: url('bg2.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            background-size:cover;            
        }

        h1, h2, h3, h4, h5, h6{
    text-align: center;
    color: darkred;
    background-color: yellow;
    border-radius: 20px;
}

p{
    text-align: justify;
    color:bisque;
    background-color: darkblue;
    padding:20px;
    border: solid;
    border-color: darkorange;
    border-radius: 20px;
}

.flex-container {
  display: flex;       /* Activates flexbox alignment */
  gap: 10px;          /* Adds spacing between your side-by-side containers */
}

.box {
  flex: 1;            /* Forces them to grow and share the width equally */
  padding: 20px;
  background-color: #f0f0f0;
  border-radius: 10px;
}
    </style>
</head>
<body>
   <h1>Hello World</h1>
   <div class="flex-container">
        <div class="box">Para 1</div>
        <div class="box">Para 2</div>
   </div>
<br />
   <div class="flex-container">
    <div class="box" style="margin-left: 300px;margin-right: 300px;">Para 1</div>
</div>
<br />
<div class="flex-container">
    <div class="box">Para 1</div>
    <div class="box">Para 2</div>
    <div class="box">Para 3</div>
</div>
</body>
</html>
